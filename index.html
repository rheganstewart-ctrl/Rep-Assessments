<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision AI - Knowledge Assessment</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F5F5F3;color:#1a1a1a;min-height:100vh;padding:2rem 1rem;}
.container{max-width:680px;margin:0 auto;}
.header{margin-bottom:2rem;text-align:center;}
.header h1{font-size:22px;font-weight:500;color:#1a1a1a;margin-bottom:6px;}
.header p{font-size:14px;color:#666;}
.name-card{background:#fff;border:0.5px solid #e0e0dc;border-radius:12px;padding:2.5rem;text-align:center;}
.name-card .logo{font-size:12px;font-weight:600;color:#1D9E75;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:1.5rem;}
.name-card h2{font-size:20px;font-weight:500;margin-bottom:6px;}
.name-card p{font-size:14px;color:#666;margin-bottom:1.5rem;}
.form-group{text-align:left;margin-bottom:1rem;}
.form-group label{display:block;font-size:13px;font-weight:500;color:#444;margin-bottom:4px;}
.form-group input{width:100%;padding:0.65rem 0.9rem;border:0.5px solid #e0e0dc;border-radius:8px;font-size:14px;color:#1a1a1a;background:#f5f5f3;outline:none;}
.form-group input:focus{border-color:#1D9E75;background:#fff;}
.field-error{border-color:#E24B4A !important;}
.prog-bg{background:#E0E0DC;border-radius:8px;height:6px;margin-bottom:8px;}
.prog-fill{background:#1D9E75;height:6px;border-radius:8px;transition:width 0.4s ease;}
.sect-label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:#888;margin-bottom:1rem;}
.qcard{background:#fff;border:0.5px solid #e0e0dc;border-radius:12px;padding:1.5rem;margin-bottom:1rem;}
.q-num{font-size:12px;color:#aaa;margin-bottom:4px;}
.q-text{font-size:15px;font-weight:500;color:#1a1a1a;margin-bottom:1rem;line-height:1.55;}
.xray-wrap{border-radius:8px;border:0.5px solid #e0e0dc;margin-bottom:1rem;overflow:hidden;background:#0a0a0a;}
.xray-wrap img{width:100%;display:block;max-height:320px;object-fit:contain;}
.xray-cap{font-size:12px;color:#888;padding:5px 10px;background:#f5f5f3;border-top:0.5px solid #e0e0dc;}
.ui-wrap{border-radius:8px;border:0.5px solid #e0e0dc;margin-bottom:1rem;overflow:hidden;background:#f5f5f3;padding:1.25rem;display:flex;justify-content:center;}
.ui-wrap img{display:block;max-width:340px;width:100%;border-radius:6px;}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1rem;}
.lpill{display:flex;align-items:center;gap:5px;font-size:11px;color:#555;background:#f5f5f3;border-radius:20px;padding:3px 9px;border:0.5px solid #e0e0dc;}
.sw{width:11px;height:11px;border-radius:2px;flex-shrink:0;}
.sw-blue{background:#4A90D9;}.sw-orange{background:#E8A000;}.sw-red{background:#D0312D;}
.sw-yellow{background:#C8B400;border:1px solid #999;}.sw-green{background:#3DBE6E;}
.sw-white{background:#fff;border:1px solid #aaa;}.sw-purple-light{background:#b39ddb;}
.sw-purple-dark{background:#6a1b9a;}
.callout{background:#f5f5f3;border-left:3px solid #1D9E75;border-radius:0 6px 6px 0;padding:0.65rem 1rem;margin-bottom:1rem;font-size:13px;color:#555;}
.callout strong{color:#1a1a1a;font-weight:500;}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500;margin-bottom:0.75rem;}
.ti{background:#E6F1FB;color:#0C447C;}.tc{background:#FCEBEB;color:#791F1F;}
.tv{background:#EEEDFE;color:#3C3489;}.tf{background:#E1F5EE;color:#085041;}
.tb{background:#FAEEDA;color:#633806;}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;background:#f5f5f3;border:0.5px solid #e0e0dc;border-radius:8px;padding:0.65rem 1rem;margin-bottom:0.5rem;cursor:pointer;font-size:14px;color:#1a1a1a;text-align:left;}
.opt:hover:not(:disabled){border-color:#bbb;background:#fff;}
.opt:disabled{cursor:default;}
.opt.sc{background:#EAF3DE;border-color:#639922;color:#27500A;}
.opt.sw2{background:#FCEBEB;border-color:#E24B4A;color:#501313;}
.opt.rc{background:#EAF3DE;border-color:#639922;color:#27500A;}
.oletter{font-size:12px;font-weight:500;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#e0e0dc;color:#666;flex-shrink:0;margin-top:1px;}
.sc .oletter{background:#639922;color:#fff;}.sw2 .oletter{background:#E24B4A;color:#fff;}.rc .oletter{background:#639922;color:#fff;}
.fb{font-size:13px;margin-top:0.75rem;padding:0.65rem 0.9rem;border-radius:6px;line-height:1.6;}
.fb.ok{background:#EAF3DE;color:#27500A;}.fb.no{background:#FCEBEB;color:#501313;}
.nav{display:flex;gap:10px;margin-top:1rem;}
.btn-p{background:#1D9E75;color:#fff;border:none;border-radius:8px;padding:0.65rem 1.5rem;font-size:14px;cursor:pointer;font-weight:500;}
.btn-p:hover{background:#0F6E56;}
.btn-s{background:transparent;color:#666;border:0.5px solid #e0e0dc;border-radius:8px;padding:0.65rem 1.2rem;font-size:14px;cursor:pointer;}
.btn-s:hover{background:#f5f5f3;}
.score-card{background:#fff;border:0.5px solid #e0e0dc;border-radius:12px;padding:2.5rem;text-align:center;}
.score-num{font-size:56px;font-weight:500;color:#1D9E75;line-height:1;}
.score-badge{font-size:15px;color:#666;margin:0.5rem 0 1.5rem;}
.s-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:1.5rem;}
.s-cell{background:#f5f5f3;border-radius:8px;padding:0.85rem;}
.s-cell .v{font-size:24px;font-weight:500;color:#1a1a1a;}
.s-cell .l{font-size:12px;color:#888;margin-top:2px;}
.sec-scores{text-align:left;border:0.5px solid #e0e0dc;border-radius:8px;overflow:hidden;margin-bottom:1.5rem;}
.sec-scores-title{font-size:12px;font-weight:500;color:#888;padding:0.6rem 1rem;background:#f5f5f3;border-bottom:0.5px solid #e0e0dc;text-transform:uppercase;letter-spacing:0.06em;}
.sec-row{display:flex;align-items:center;justify-content:space-between;padding:0.6rem 1rem;border-bottom:0.5px solid #f0f0ec;font-size:13px;}
.sec-row:last-child{border-bottom:none;}
.sec-name{color:#555;}.sec-pct{font-weight:500;}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.hidden{display:none;}

</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Vision AI &mdash; Knowledge Assessment</h1>
    <p>28 questions &nbsp;&middot;&nbsp; 5 sections &nbsp;&middot;&nbsp; 85% to pass</p>
  </div>
  <div id="name-screen">
    <div class="name-card">
      <div class="logo">Overjet</div>
      <h2>Welcome</h2>
      <p>Enter your details below to begin.</p>
      <div class="form-group"><label for="rep-name">Full name</label><input type="text" id="rep-name" placeholder="e.g. Jane Smith" /></div>
      <div class="form-group"><label for="rep-email">Work email</label><input type="email" id="rep-email" placeholder="e.g. jane@overjet.com" /></div>
      <button class="btn-p" style="width:100%;margin-top:0.5rem;" onclick="startAssessment()">Start assessment &rarr;</button>
    </div>
  </div>
  <div id="quiz-screen" class="hidden">
    <div class="prog-bg"><div class="prog-fill" id="prog" style="width:0%"></div></div>
    <div class="sect-label" id="sect-lbl"></div>
    <div id="q-area"></div>
  </div>
  <div id="score-screen" class="hidden">
    <div class="score-card">
      <div class="score-num" id="sc-pct"></div>
      <div class="score-badge" id="sc-badge"></div>
      <div class="s-grid">
        <div class="s-cell"><div class="v" id="sc-c"></div><div class="l">Correct</div></div>
        <div class="s-cell"><div class="v" id="sc-w"></div><div class="l">Missed</div></div>
        <div class="s-cell"><div class="v" id="sc-t"></div><div class="l">Total</div></div>
      </div>
      <div class="sec-scores"><div class="sec-scores-title">Score by section</div><div id="sec-rows"></div></div>
      <div class="btn-row"><button class="btn-p" onclick="retake()">Retake assessment</button></div>
    </div>
  </div>
</div>

var Qs=[
  {sec:"Image identification",tag:"ti",tagLbl:"Image ID",img:I1,imgType:"xray",cap:"Overjet Vision AI - posterior bitewing",legend:[{cls:"sw-blue",lbl:"Existing restorations"},{cls:"sw-orange",lbl:"Calculus"},{cls:"sw-red",lbl:"Decay - dentin"},{cls:"sw-yellow",lbl:"Incipient/enamel decay"}],callout:null,text:"The large blue-shaded areas covering the crowns of these teeth represent what?",opts:["Active decay spreading across adjacent teeth","Existing restorations (fillings, crowns, etc.)","Bone loss detected by the AI","Areas flagged as high fracture risk"],correct:1,exp:"Blue annotations represent existing restorations - prior fillings, crowns, or other dental work. This gives the clinician and patient a complete picture of treatment history directly on the radiograph."},
  {sec:"Image identification",tag:"ti",tagLbl:"Image ID",img:I1,imgType:"xray",cap:"Overjet Vision AI - posterior bitewing",legend:null,callout:null,text:"The orange boxes drawn around specific areas on the teeth flag which finding?",opts:["Incipient enamel decay","Periapical radiolucency (PARL)","Calculus buildup","Existing crown margins"],correct:2,exp:"Orange boxes flag calculus deposits. Identifying calculus radiographically supports clinical conversations around periodontal health and reinforces recommendations for scaling and root planing."},
  {sec:"Image identification",tag:"ti",tagLbl:"Image ID",img:I1,imgType:"xray",cap:"Overjet Vision AI - posterior bitewing",legend:null,callout:null,text:"The red segmented areas indicate which clinical finding?",opts:["Incipient decay in the enamel only","Decay that has progressed into the dentin","Periapical abscess","Root resorption"],correct:1,exp:"Red annotations represent decay into the dentin - more advanced and typically requiring restorative treatment. When patients see this on their own x-ray, the conversation shifts from trust me to let me show you, directly driving the 25% case acceptance lift."},
  {sec:"Image identification",tag:"ti",tagLbl:"Image ID",img:I1,imgType:"xray",cap:"Overjet Vision AI - posterior bitewing",legend:null,callout:null,text:"The yellow segmented areas represent what stage of decay?",opts:["Decay into the pulp - extraction needed","Decay into the dentin requiring a crown","Incipient (early) decay or decay in the enamel only","Calculus hardened onto the root surface"],correct:2,exp:"Yellow annotations indicate incipient decay - early-stage, enamel-only findings. Catching decay here before it reaches the dentin stage is a key clinical value: less invasive treatment and a stronger patient prevention conversation."},
  {sec:"Image identification",tag:"ti",tagLbl:"Image ID",img:I2,imgType:"xray",cap:"Overjet Vision AI - periapical series",legend:[{cls:"sw-yellow",lbl:"PARL (periapical radiolucency)"},{cls:"sw-green",lbl:"Bone loss % of root length"}],callout:null,text:"The yellow segmented area at the apex (tip) of a tooth root represents what?",opts:["Incipient enamel decay on the crown","Calculus deposit near the gumline","PARL - periapical radiolucency, indicating infection or pathology at the root tip","A normal anatomical landmark with no clinical concern"],correct:2,exp:"The yellow area at the root apex is a PARL - periapical radiolucency. It indicates pathology at the root tip, most commonly infection, abscess, or necrotic pulp. This finding often leads to endodontic referral."},
  {sec:"Image identification",tag:"ti",tagLbl:"Image ID",img:I2,imgType:"xray",cap:"Overjet Vision AI - periapical series",legend:null,callout:null,text:"The yellow lines with percentage values (20%, 23%, 22%, 19%) along the roots represent what?",opts:["AI confidence score per tooth","DMF percentage per tooth","Moderate radiographic bone loss","Insurance claim approval probability"],correct:2,exp:"These yellow lines represent moderate radiographic bone loss - shown as a percentage of total root length. 23% bone loss means nearly a quarter of the supporting bone is gone. Expressing bone loss as a percentage is more intuitive for patients than millimeters alone."},
  {sec:"Image identification",tag:"ti",tagLbl:"Image ID",img:I3,imgType:"xray",cap:"Overjet Vision AI - anterior series",legend:[{cls:"sw-green",lbl:"Bone level (mm)"},{cls:"sw-white",lbl:"Marginal discrepancy"},{cls:"sw-blue",lbl:"Existing restorations"}],callout:null,text:"The small white box at the crown margin of a restored tooth flags what?",opts:["A new carious lesion under the crown","Marginal discrepancy - a gap or open margin at the edge of a restoration","Calculus at the gumline","A PARL forming at the root tip"],correct:1,exp:"The white box flags a marginal discrepancy - an open or poorly sealed margin at the edge of a restoration. Open margins allow bacterial infiltration leading to recurrent decay. Showing this annotation chairside is a powerful moment for restoration replacement conversations."},
  {sec:"Image identification",tag:"ti",tagLbl:"Image ID",img:I3,imgType:"xray",cap:"Overjet Vision AI - anterior series",legend:null,callout:null,text:"The green millimeter measurements (1.7, 2.1, 0.8, 1.0) along root surfaces represent what?",opts:["Pocket depth from periodontal probing","AI-measured bone levels in millimeters from crestal bone to the CEJ","Crown length measurements for prosthetics","Tooth mobility scores"],correct:1,exp:"Green measurements are AI-measured bone levels - the distance from crestal bone to the cemento-enamel junction (CEJ). Millimeter-precision bone measurement is one of Vision AIs strongest clinical differentiators: an objective number the patient can see on their own x-ray."},
  {sec:"Image identification",tag:"ti",tagLbl:"Image ID",img:I3,imgType:"xray",cap:"Overjet Vision AI - full annotation legend",legend:[{cls:"sw-blue",lbl:"Existing restorations"},{cls:"sw-orange",lbl:"Calculus"},{cls:"sw-red",lbl:"Decay - dentin"},{cls:"sw-yellow",lbl:"Incipient/enamel decay or PARL"},{cls:"sw-green",lbl:"Bone level (mm)"},{cls:"sw-white",lbl:"Marginal discrepancy"}],callout:null,text:"A new patient sees their annotated x-ray and says I had no idea there was so much going on. Which Vision AI value prop does this moment most directly represent?",opts:["The reduction in claim denials from objective AI documentation","The shift from trust me to let me show you - visual evidence that drives case acceptance","The workflow efficiency gain from AI running in the background","The FDA clearance story that builds clinical credibility"],correct:1,exp:"This is the core chairside moment Vision AI is built for. Color-coded findings, measurements, and treatment flags transform the x-ray into a patient-facing visual. This is where the 25% case acceptance lift comes from."},
  {sec:"Image identification",tag:"ti",tagLbl:"Image ID",img:I7,imgType:"xray",cap:"Overjet Vision AI - periapical with root canal and pulp annotations",legend:[{cls:"sw-purple-light",lbl:"Previous root canal"},{cls:"sw-purple-dark",lbl:"Pulp"},{cls:"sw-blue",lbl:"Existing restorations"},{cls:"sw-yellow",lbl:"Bone loss %"}],callout:null,text:"In this x-ray, the light purple shading visible along the root canals of several teeth represents what?",opts:["Active infection spreading through the root","Previous root canal treatment","The pulp inside a healthy tooth","Calculus buildup along the root surface"],correct:1,exp:"Light purple annotations represent a previous root canal - teeth that have already undergone endodontic treatment. A tooth with a prior root canal that now shows other findings like bone loss or a PARL may need retreatment or further evaluation."},
  {sec:"Image identification",tag:"ti",tagLbl:"Image ID",img:I7,imgType:"xray",cap:"Overjet Vision AI - periapical with root canal and pulp annotations",legend:null,callout:null,text:"In this same x-ray, the dark purple shading visible inside the crown and root of untreated teeth represents what?",opts:["A previous root canal treatment","Decay that has reached the pulp chamber","The pulp","Bone loss around the root"],correct:2,exp:"Dark purple represents the pulp - the living tissue inside the tooth containing nerves and blood vessels. Overjet annotates pulp anatomy to give the clinician a full picture of tooth structure. When combined with findings like deep decay or bone loss, pulp visibility helps contextualize the clinical urgency of treatment."},
  {sec:"Image identification",tag:"ti",tagLbl:"Image ID",img:I8,imgType:"xray",cap:"Overjet Vision AI - potential implant space measurement",legend:[{cls:"sw-white",lbl:"Potential implant space (mm)"},{cls:"sw-purple-dark",lbl:"Pulp"},{cls:"sw-purple-light",lbl:"Previous root canal"},{cls:"sw-blue",lbl:"Existing restorations"},{cls:"sw-yellow",lbl:"Bone loss %"}],callout:null,text:"This x-ray shows a white horizontal line measuring 8.7mm between two teeth. What finding does this measurement represent?",opts:["Marginal discrepancy between two adjacent crowns","The width of an existing restoration","Potential implant space - the AI has detected sufficient edentulous space for an implant","A bone loss measurement across the alveolar ridge"],correct:2,exp:"The white horizontal line represents a potential implant finding - the AI detected an edentulous space and measured the available width. This surfaces implant candidates automatically, helping practices identify treatment options patients may not know are available."},
  {sec:"Image identification",tag:"ti",tagLbl:"Image ID",img:I8,imgType:"xray",cap:"Overjet Vision AI - potential implant space measurement",legend:null,callout:null,text:"What is the minimum space measurement required for Vision AI to surface a Potential Implant finding?",opts:["5mm or greater","6mm or greater","7mm or greater","9mm or greater"],correct:2,exp:"Vision AI surfaces the Potential Implant finding when there is 7mm or greater of edentulous space detected. In this image the measurement is 8.7mm - comfortably above the threshold. Reps should know this threshold so they can explain to clinical buyers exactly how the AI decides when to flag an implant opportunity."},
  {sec:"Clinical finding logic",tag:"tc",tagLbl:"Clinical logic",img:I5,imgType:"ui",cap:"Overjet Vision AI - Crown DMF finding",legend:null,callout:"Finding shown: Crown - DMF > 50% - #19",text:"What does DMF stand for?",opts:["Dense, Missing, Fractured","Decay, Missing, Filled","Dentin, Mobility, Fracture","Diagnosis, Measurement, Finding"],correct:1,exp:"DMF stands for Decay, Missing, Filled - a standard dental index measuring the cumulative burden of disease on a tooth. Overjet calculates DMF percentage based on coronal tooth structure to identify strong crown candidates."},
  {sec:"Clinical finding logic",tag:"tc",tagLbl:"Clinical logic",img:I5,imgType:"ui",cap:"Overjet Vision AI - Crown DMF finding",legend:null,callout:null,text:"When Overjet calculates DMF%, does it evaluate the entire tooth, the root, or the coronal tooth structure only?",opts:["The entire tooth including root surface","The root structure only","The coronal tooth structure only","The periodontal attachment level"],correct:2,exp:"DMF% is calculated based on the coronal tooth structure only - the visible crown portion, not the root. Reps need to explain this accurately when a clinician asks how DMF% is derived."},
  {sec:"Clinical finding logic",tag:"tc",tagLbl:"Clinical logic",img:I5,imgType:"ui",cap:"Overjet Vision AI - Crown DMF finding",legend:null,callout:null,text:"A tooth shows Crown - DMF > 50%. What does this mean for insurance?",opts:["Insurance will automatically deny the claim","Insurance auto-adjudicates crown claims when DMF% is 50% or greater, making approval significantly easier","The practice must submit a pre-authorization request","The finding has no insurance implication"],correct:1,exp:"When a tooth's DMF% is 50% or greater, insurance typically auto-adjudicates the crown claim - automatically approving coverage based on the documented disease level. This directly supports faster, smoother crown claim approval."},
  {sec:"Clinical finding logic",tag:"tc",tagLbl:"Clinical logic",img:I5,imgType:"ui",cap:"Overjet Vision AI - Crown DMF finding",legend:null,callout:null,text:"A patient's tooth shows DMF > 50%. Does this automatically mean the patient needs a crown?",opts:["Yes - if the AI flags it, a crown is always the right treatment","Yes - insurance approval is enough to proceed","No - treatment is always the doctor's decision. DMF > 50% supports the case but the clinician makes the final call","No - the patient must request the treatment themselves"],correct:2,exp:"DMF > 50% is a clinical indicator, not a prescription. Treatment is always the doctor's decision. Overjet surfaces findings and supports documentation - it never replaces clinical judgment."},
  {sec:"Clinical finding logic",tag:"tc",tagLbl:"Clinical logic",img:I4,imgType:"ui",cap:"Overjet Vision AI - SRP treatment recommendation",legend:null,callout:null,text:"What two specific clinical findings must be present on the same teeth for a confirmed SRP recommendation to appear?",opts:["Calculus present AND radiographic decay into the dentin","Periodontal pocket depth of 4mm or greater AND radiographic bone loss of 3mm or greater on the same teeth","Bone loss greater than 25% of root length AND a PARL at the root apex","Any bone loss AND incipient enamel decay on the same tooth"],correct:1,exp:"Confirmed SRP requires both on the same teeth: periodontal pocket depth of 4mm or greater AND radiographic bone loss of 3mm or greater. Both conditions must be met together - one without the other will not trigger the flag."},
  {sec:"Clinical finding logic",tag:"tc",tagLbl:"Clinical logic",img:I6,imgType:"ui",cap:"Overjet Vision AI - Possible SRP finding",legend:null,callout:null,text:"This finding is labeled Possible SRP - LL. What does Possible SRP indicate?",opts:["Possible SRP means the AI is confident SRP is needed","Possible SRP means the clinician already declined the recommendation","Possible SRP means radiographic bone loss greater than 3mm was detected, but pocket depths were healthy - the clinician needs to reprobe","Possible SRP appears when calculus is present without bone loss"],correct:2,exp:"Possible SRP means the AI detected radiographic bone loss greater than 3mm, but recorded pocket depths were healthy. The clinician needs to reprobe before any SRP recommendation can be confirmed."},
  {sec:"Clinical finding logic",tag:"tc",tagLbl:"Clinical logic",img:I6,imgType:"ui",cap:"Overjet Vision AI - Possible SRP finding",legend:null,callout:null,text:"Does a Possible SRP flag mean the patient needs SRP?",opts:["Yes - radiographic bone loss alone indicates SRP","Yes - the AI finding is sufficient documentation to proceed","No - Possible SRP is a prompt to reprobe. Pocket depth of 4mm+ is still needed to support an SRP claim","No - Possible SRP only appears for insurance documentation"],correct:2,exp:"Possible SRP does not mean the patient needs SRP. It is a clinical prompt to reprobe. Additional evidence - pocket depth 4mm+ on those teeth - is required before SRP can be clinically justified."},
  {sec:"Clinical finding logic",tag:"tc",tagLbl:"Clinical logic",img:null,imgType:null,cap:null,legend:null,callout:null,text:"Overjet Vision AI includes a historical radiographic lookback. How far back does it go?",opts:["6 months","12 months","24 months","5 years"],correct:1,exp:"Vision AI includes a 12-month historical lookback, allowing the AI to analyze and compare a patient's prior radiographs within the past year. This helps track changes in findings over time like bone loss progression or decay advancement."},
  {sec:"Clinical finding logic",tag:"tc",tagLbl:"Clinical logic",img:null,imgType:null,cap:null,legend:null,callout:null,text:"When Overjet looks at treatment plans in the practice's PMS, how many years of history does it review?",opts:["1 year","2 years","3 years","5 years"],correct:2,exp:"Overjet reviews 3 years of treatment plan history from the practice's PMS. This allows the AI to surface treatments that were recommended but never completed - helping practices recapture revenue from patients who have been putting off care."},
  {sec:"Value props & ROI",tag:"tv",tagLbl:"Value prop",img:null,imgType:null,cap:null,legend:null,callout:null,text:"What are the primary 3 ROI value drivers with Vision AI?",opts:["Reduced staff turnover, faster patient intake, and lower imaging costs","Increased case acceptance, improved diagnosis and treatment identification, and insurance and documentation support","Higher patient volume, reduced cancellations, and automated billing","Faster x-ray turnaround, reduced re-takes, and improved patient satisfaction scores"],correct:1,exp:"The three primary ROI value drivers are: increased case acceptance (patients can see their findings visually), improved diagnosis and treatment identification (AI surfaces findings that might be missed), and insurance and documentation support (objective AI annotations reduce claim denials and support auto-adjudication)."},
  {sec:"Functionality & workflow",tag:"tf",tagLbl:"Functionality",img:null,imgType:null,cap:null,legend:null,callout:null,text:"What is Vision AI's implementation model?",opts:["Practices must replace their imaging software with Overjet's platform","It requires a 6-month IT integration before go-live","It integrates into the practice's existing imaging workflow - no new hardware, no workflow change, nothing new to learn","It only works with cloud-based practice management systems"],correct:2,exp:"Vision AI runs inside the practice's existing imaging workflow. The approved positioning: FDA-cleared AI. Your existing imaging workflow. Nothing new to learn. One of the most effective objection handlers for practices worried about disruption."},
  {sec:"Functionality & workflow",tag:"tf",tagLbl:"Functionality",img:null,imgType:null,cap:null,legend:null,callout:null,text:"What happens approximately one minute after an x-ray is taken when Vision AI is active?",opts:["A findings report is emailed to the patient","The doctor receives a Slack notification with a summary","AI annotations appear overlaid on the x-ray - color-coded findings, bone measurements, DMF%, and treatment flags visible chairside","The image is queued for manual review by Overjet's clinical team"],correct:2,exp:"Within about a minute, Vision AI overlays color-coded annotations, measurements, DMF%, and treatment flags on the x-ray automatically - no manual step, no delay. Speed and automation are critical selling points."},
  {sec:"Functionality & workflow",tag:"tf",tagLbl:"Functionality",img:null,imgType:null,cap:null,legend:null,callout:null,text:"Which of the following is NOT a Vision AI image tool available within the interface?",opts:["Brightness and contrast adjustment","Spotlight and magnifying glass","Auto enhance","Insurance eligibility verification"],correct:3,exp:"Vision AI image tools include brightness, contrast, gamma, spotlight, magnifying glass, and auto enhance. Insurance eligibility verification is an RCM feature - not a Vision AI tool."},
  {sec:"Functionality & workflow",tag:"tf",tagLbl:"Functionality",img:null,imgType:null,cap:null,legend:null,callout:null,text:"A prospect asks: Will your AI tell my doctors what treatment to do? What is the most accurate response?",opts:["Yes - the AI generates a complete treatment plan the doctor approves or declines","Yes - for crown and SRP findings, the AI recommendation is the treatment plan","No - Overjet surfaces findings and supports documentation. Treatment decisions always belong to the clinician","No - the AI only identifies findings and never makes any recommendation at all"],correct:2,exp:"Overjet surfaces clinical findings, flags potential recommendations, and creates documentation - but treatment is always the doctor's call. The AI supports clinical judgment, it does not replace it."},
  {sec:"Buyers & personas",tag:"tb",tagLbl:"Buyer IQ",img:null,imgType:null,cap:null,legend:null,callout:null,text:"Vision AI has three buyer personas. Which is the primary target and what do they care most about?",opts:["Economic Buyer (CEO/CFO) - ROI payback period and monthly cost","Operations Sponsor (VP Ops/COO) - workflow efficiency and denial reduction","Clinical Champion (CCO/VP Clinical) - clinical validation, second opinion framing, and FDA clearances","IT Director - integration security and data compliance"],correct:2,exp:"The Clinical Champion - CCO, VP Clinical, or lead doctor - is the primary Vision AI persona. Lead with clinical validation, accuracy, and FDA clearances. Reps who open with price to a clinical buyer almost always lose the room."}
];

var SCRIPT_URL='https://script.google.com/a/macros/overjet.ai/s/AKfycbzWhtpaeZU3lrM6RWDZMITufC_WLHcr8ngruXfH1xj62lYX2-YF0kXVoHbjqlRe9LcP/exec';
var SECS=["Image identification","Clinical finding logic","Value props & ROI","Functionality & workflow","Buyers & personas"];
var repName='',repEmail='',cur=0,ans=[],answered=false;

function startAssessment(){
  var n=document.getElementById('rep-name').value.trim();
  var e=document.getElementById('rep-email').value.trim();
  document.getElementById('rep-name').classList.remove('field-error');
  document.getElementById('rep-email').classList.remove('field-error');
  if(!n){document.getElementById('rep-name').classList.add('field-error');return;}
  if(!e||e.indexOf('@')===-1){document.getElementById('rep-email').classList.add('field-error');return;}
  repName=n;repEmail=e;cur=0;ans=[];answered=false;
  document.getElementById('name-screen').classList.add('hidden');
  document.getElementById('score-screen').classList.add('hidden');
  document.getElementById('quiz-screen').classList.remove('hidden');
  renderQ();
}

function secNum(s){return SECS.indexOf(s)+1;}

function renderQ(){
  answered=false;
  var q=Qs[cur];
  document.getElementById('prog').style.width=Math.round((cur/Qs.length)*100)+'%';
  document.getElementById('sect-lbl').textContent='Section '+secNum(q.sec)+' of '+SECS.length+' - '+q.sec;
  var imgHtml='';
  if(q.img){
    if(q.imgType==='ui'){
      imgHtml='<div class="ui-wrap"><img src="'+q.img+'" alt="UI" /></div>';
    }else{
      var leg=q.legend?'<div class="legend">'+q.legend.map(function(l){return '<span class="lpill"><span class="sw '+l.cls+'"></span>'+l.lbl+'</span>';}).join('')+'</div>':'';
      imgHtml='<div class="xray-wrap"><img src="'+q.img+'" alt="X-ray" /><div class="xray-cap">'+q.cap+'</div></div>'+leg;
    }
  }
  var callHtml=q.callout?'<div class="callout"><strong>'+q.callout+'</strong></div>':'';
  var L=['A','B','C','D'];
  var opts=q.opts.map(function(o,i){return '<button class="opt" onclick="pickAnswer('+i+')" id="opt'+i+'"><span class="oletter">'+L[i]+'</span><span>'+o+'</span></button>';}).join('');
  document.getElementById('q-area').innerHTML=
    '<div class="qcard">'+
    '<div class="q-num">Question '+(cur+1)+' of '+Qs.length+'</div>'+
    '<span class="tag '+q.tag+'">'+q.tagLbl+'</span>'+
    '<div class="q-text">'+q.text+'</div>'+
    imgHtml+callHtml+
    '<div id="opts-area">'+opts+'</div>'+
    '<div id="fb-area"></div>'+
    '</div>'+
    '<div class="nav" id="nav-area"><button class="btn-s" onclick="skipQ()">Skip</button></div>';
}

function pickAnswer(i){
  if(answered)return;
  answered=true;
  var q=Qs[cur];
  var ok=(i===q.correct);
  ans.push({sec:q.sec,ok:ok});
  document.querySelectorAll('.opt').forEach(function(b){b.disabled=true;});
  document.getElementById('opt'+i).classList.add(ok?'sc':'sw2');
  if(!ok)document.getElementById('opt'+q.correct).classList.add('rc');
  document.getElementById('fb-area').innerHTML='<div class="fb '+(ok?'ok':'no')+'">'+(ok?'Correct - ':'Not quite - ')+q.exp+'</div>';
  var isLast=(cur>=Qs.length-1);
  document.getElementById('nav-area').innerHTML='<button class="btn-p" onclick="'+(isLast?'showScore()':'nextQ()')+'">'+( isLast?'See my results':'Next question')+'</button>';
}

function skipQ(){ans.push({sec:Qs[cur].sec,ok:false});cur++;if(cur<Qs.length){renderQ();}else{showScore();}}
function nextQ(){cur++;if(cur<Qs.length){renderQ();}else{showScore();}}

function showScore(){
  var correct=ans.filter(function(a){return a.ok;}).length;
  var total=Qs.length;
  var pct=Math.round((correct/total)*100);
  var badge=pct>=85?'Certified-ready':pct>=70?'Getting there - keep reviewing':'More study needed before your cert attempt';
  document.getElementById('sc-pct').textContent=pct+'%';
  document.getElementById('sc-badge').textContent=badge;
  document.getElementById('sc-c').textContent=correct;
  document.getElementById('sc-w').textContent=total-correct;
  document.getElementById('sc-t').textContent=total;
  var secMap={};
  SECS.forEach(function(s){secMap[s]={c:0,t:0};});
  ans.forEach(function(a){secMap[a.sec].t++;if(a.ok)secMap[a.sec].c++;});
  var rows='';
  SECS.forEach(function(s){
    var d=secMap[s];if(!d.t)return;
    var sp=Math.round((d.c/d.t)*100);
    var col=sp>=85?'#3B6D11':sp>=70?'#854F0B':'#A32D2D';
    rows+='<div class="sec-row"><span class="sec-name">'+s+'</span><span class="sec-pct" style="color:'+col+'">'+d.c+'/'+d.t+' - '+sp+'%</span></div>';
  });
  document.getElementById('sec-rows').innerHTML=rows;
  var secScores={};
  SECS.forEach(function(s){var d=secMap[s];if(d.t)secScores[s]=Math.round((d.c/d.t)*100);});
  try{fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:repName,email:repEmail,assessment:'Vision AI',score:correct,total:total,pct:pct,timestamp:new Date().toISOString(),secScores:JSON.stringify(secScores)})});}catch(e){console.log('error',e);}
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('score-screen').classList.remove('hidden');
}

function retake(){
  cur=0;ans=[];answered=false;
  document.getElementById('score-screen').classList.add('hidden');
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('rep-name').value='';
  document.getElementById('rep-email').value='';
  document.getElementById('name-screen').classList.remove('hidden');
}
</script>
</body>
</html>
